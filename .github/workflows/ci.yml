name: CI Microservices Stack

on:
  push:
    branches: [ main, tugas-lab-13 ]
  pull_request:
    branches: [ main, tugas-lab-13 ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root test dependencies
        run: npm ci

      - name: Build and start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          timeout 90 bash -c '
            until [ "$(docker compose ps --format json | grep -c "\"Health\":\"healthy\"")" -ge 4 ]; do
              echo "Menunggu seluruh container healthy..."
              sleep 3
            done
          '
          sleep 3
          docker compose ps

      - name: Run automated integration tests
        run: npm test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v